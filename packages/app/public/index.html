<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        function randomUUID() {
          var bytes = new Uint8Array(16);
          if (globalThis.crypto && globalThis.crypto.getRandomValues) {
            globalThis.crypto.getRandomValues(bytes);
          } else {
            for (var i = 0; i < 16; i++) {
              bytes[i] = (Math.random() * 256) | 0;
            }
          }
          bytes[6] = (bytes[6] & 15) | 64;
          bytes[8] = (bytes[8] & 63) | 128;
          var hex = Array.prototype.map.call(bytes, function (b) {
            return ('0' + b.toString(16)).slice(-2);
          }).join('');
          return (
            hex.slice(0, 8) +
            '-' +
            hex.slice(8, 12) +
            '-' +
            hex.slice(12, 16) +
            '-' +
            hex.slice(16, 20) +
            '-' +
            hex.slice(20)
          );
        }

        if (
          globalThis.crypto &&
          typeof globalThis.crypto.randomUUID === 'function'
        ) {
          return;
        }

        var base =
          globalThis.crypto ||
          ({
            getRandomValues: function (arr) {
              for (var i = 0; i < arr.length; i++) {
                arr[i] = (Math.random() * 256) | 0;
              }
              return arr;
            },
          });

        try {
          Object.defineProperty(base, 'randomUUID', {
            value: randomUUID,
            configurable: true,
            writable: true,
          });
          globalThis.crypto = base;
        } catch (e) {
          globalThis.crypto = new Proxy(base, {
            get: function (target, prop) {
              if (prop === 'randomUUID') {
                return randomUUID;
              }
              var value = target[prop];
              return typeof value === 'function' ? value.bind(target) : value;
            },
          });
        }
      })();
    </script>
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Backstage is an open source framework for building developer portals"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link
      rel="manifest"
      href="<%= publicPath %>/manifest.json"
      crossorigin="use-credentials"
    />
    <link rel="icon" href="<%= publicPath %>/favicon.ico" />
    <link rel="shortcut icon" href="<%= publicPath %>/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="<%= publicPath %>/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="<%= publicPath %>/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="<%= publicPath %>/favicon-16x16.png"
    />
    <link
      rel="mask-icon"
      href="<%= publicPath %>/safari-pinned-tab.svg"
      color="#5bbad5"
    />
    <title><%= config.getOptionalString('app.title') ?? 'Backstage' %></title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

  </body>
</html>
